name: Continuous Integration

permissions:
  contents: read

on:
  push:
    branches: [main, dev, 'codex/**']
  pull_request:
    branches: [main, dev]

jobs:
  backend-lint-test:
    env:
      APP_ENV: testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -e ./sdk/python -e ./cli

      - name: Lint with Ruff
        run: |
          ruff check backend/

      - name: Verify Formatting with Black
        run: |
          black --check backend/

      - name: Run Tests with Pytest
        run: |
          pytest backend/tests sdk/python/tests cli/tests

  frontend-lint-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Check Formatting with Prettier
        run: |
          cd frontend
          npx prettier --check "src/**/*.{ts,tsx,css,json,md}"

      - name: Type Check with TypeScript
        run: |
          cd frontend
          npm run typecheck

      - name: Lint with ESLint
        run: |
          cd frontend
          npm run lint

      - name: Unit tests
        run: cd frontend && npm test

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Build Docker Compose
        run: |
          docker compose build

  browser-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: cd frontend && npm ci && npx playwright install --with-deps chrome
      - name: Start isolated test services
        run: |
          python backend/tests/ui_server.py > /tmp/evalforge-api.log 2>&1 &
          cd frontend
          npm run dev -- --host 127.0.0.1 > /tmp/evalforge-ui.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5173/ >/dev/null && curl -sf http://127.0.0.1:8000/api/v1/live >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: cd frontend && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-release-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
