name: Continuous Integration

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Lint with Ruff
        run: |
          cd backend
          ruff check .

      - name: Verify Formatting with Black
        run: |
          cd backend
          black --check .

      - name: Run Tests with Pytest
        run: |
          cd backend
          pytest

  frontend-lint-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Check Formatting with Prettier
        run: |
          cd frontend
          npx prettier --check "src/**/*.{ts,tsx,css,json,md}"

      - name: Type Check with TypeScript
        run: |
          cd frontend
          npm run typecheck

      - name: Lint with ESLint
        run: |
          cd frontend
          npm run lint

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Build Docker Compose
        run: |
          docker compose build
