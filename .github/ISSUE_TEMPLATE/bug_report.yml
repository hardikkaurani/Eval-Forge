name: 🐛 Bug Report
description: Report a reproducible bug or unexpected error in EvalForge
title: "[BUG]: "
labels: ["bug", "needs reproduction"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the form below to help us reproduce and resolve the issue quickly.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happens and why it is unexpected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide detailed steps or a script to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: System environment details (OS, Python, Node, Docker versions).
      placeholder: |
        - OS: Ubuntu 24.04 / macOS Sonoma / Windows 11
        - Python version: 3.12.2
        - Node.js version: 20.11.0
        - Docker version: 25.0.3
        - EvalForge version: v1.0.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Screenshots
      description: Paste any relevant terminal logs, stack traces, or screenshots.
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing GitHub Issues and verified this is not a duplicate.
          required: true
        - label: I have verified that this issue occurs on the latest `main` branch.
          required: true
