[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evalforge"
version = "1.0.0"
description = "Official Python SDK for Evalium — Production-grade AI Evaluation Infrastructure"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["httpx>=0.24.0", "pydantic>=2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]
