services:
  - type: web
    name: evalforge-backend
    runtime: docker
    dockerfilePath: docker/backend.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://evalforge.onrender.com", "https://app.evalforge.dev"]'
      - key: ALLOWED_HOSTS
        value: '["*"]'
      - key: DATABASE_URL
        fromDatabase:
          name: evalforge-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: evalforge-redis
          property: connectionString

  - type: redis
    name: evalforge-redis
    ipAllowList: []
    plan: free

databases:
  - name: evalforge-db
    databaseName: evalforge
    user: postgres
    plan: free
