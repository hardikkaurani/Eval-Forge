[tool.pyright]
include = ["backend"]
extraPaths = ["backend", "cli", "sdk/python"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.venv",
    "**/__pyrefly_virtual__/**",
    "**/inmemory/**"
]

[tool.pyrefly]
project-includes = ["backend"]
search-path = ["backend", "cli", "sdk/python"]
project-excludes = [
    "**/node_modules",
    "**/__pycache__",
    "**/.venv",
    "**/__pyrefly_virtual__/**",
    "**/inmemory/**"
]
